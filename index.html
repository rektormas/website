<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Lab — Real World School</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  #space {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  .hero {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    color: #fff;
  }

  .hero .welcome {
    font-size: clamp(1.1rem, 2.6vw, 2rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-weight: 300;
    color: #9db8ff;
    margin: 0 0 0.4em 0;
    text-indent: 0.5em; /* compensate for letter-spacing on last char */
    text-shadow: 0 0 20px rgba(120, 160, 255, 0.6);
    opacity: 0;
    animation: fadeIn 1.4s ease-out 0.2s forwards;
  }

  .hero .title {
    font-size: clamp(3.2rem, 11vw, 9rem);
    font-weight: 800;
    margin: 0;
    line-height: 1;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #ffffff 0%, #b9d4ff 35%, #7fa8ff 60%, #ffe9c7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 40px rgba(130, 170, 255, 0.55));
    opacity: 0;
    animation: fadeInUp 1.6s ease-out 0.5s forwards;
  }

  .hero .subtitle {
    margin-top: 0.9em;
    font-size: clamp(1rem, 2.1vw, 1.5rem);
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.75);
    opacity: 0;
    animation: fadeIn 1.4s ease-out 1.2s forwards;
  }

  .hero .subtitle::before {
    content: "";
    display: block;
    width: 60px;
    height: 1px;
    margin: 0 auto 1em auto;
    background: linear-gradient(90deg, transparent, #7fa8ff, transparent);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 10;
    opacity: 0;
    animation: fadeIn 1.4s ease-out 2s forwards;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="space"></canvas>

<div class="hero">
  <p class="welcome">Welcome to</p>
  <h1 class="title">AI Lab</h1>
  <p class="subtitle">at Real World School</p>
</div>

<div class="hint">move your cursor to disturb the sky</div>

<script>
(function () {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const mouse = { x: W / 2, y: H / 2, active: false, px: W / 2, py: H / 2, vx: 0, vy: 0 };

  window.addEventListener('mousemove', (e) => {
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.x = e.clientX; mouse.y = e.clientY;
    mouse.vx = mouse.x - mouse.px;
    mouse.vy = mouse.y - mouse.py;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', () => { mouse.active = false; });
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      mouse.px = mouse.x; mouse.py = mouse.y;
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.vx = mouse.x - mouse.px;
      mouse.vy = mouse.y - mouse.py;
      mouse.active = true;
    }
  }, { passive: true });

  function rand(min, max) { return Math.random() * (max - min) + min; }

  // ---------- Starfield ----------
  const STAR_COUNT = 260;
  const stars = [];

  function makeStar() {
    return {
      x: rand(0, W),
      y: rand(0, H),
      homeX: 0,
      homeY: 0,
      r: rand(0.5, 1.8),
      baseAlpha: rand(0.35, 1),
      twinkleSpeed: rand(0.01, 0.04),
      twinklePhase: rand(0, Math.PI * 2),
      vx: 0,
      vy: 0,
      hue: Math.random() < 0.15 ? rand(190, 230) : (Math.random() < 0.3 ? rand(20, 50) : 0)
    };
  }

  for (let i = 0; i < STAR_COUNT; i++) {
    const s = makeStar();
    s.homeX = s.x; s.homeY = s.y;
    stars.push(s);
  }

  // ---------- Planets / Suns ----------
  const bodies = [
    { x: 0.15, y: 0.22, r: 46, type: 'sun', colors: ['#fff6d0', '#ffcf6b', '#ff8a3d'] },
    { x: 0.85, y: 0.18, r: 30, type: 'planet', colors: ['#8fd3ff', '#3b7dd8', '#1c3f7a'], ring: false },
    { x: 0.78, y: 0.72, r: 42, type: 'planet', colors: ['#f3c98b', '#c98a4b', '#7a4a1e'], ring: true },
    { x: 0.10, y: 0.78, r: 22, type: 'planet', colors: ['#d0a6ff', '#8a5fd0', '#4b3080'], ring: false },
    { x: 0.5, y: 0.9, r: 16, type: 'planet', colors: ['#a6ffd6', '#4fd08a', '#237a50'], ring: false }
  ].map(b => {
    const px = b.x * W, py = b.y * H;
    return {
      ...b,
      x: px, y: py,
      homeX: px, homeY: py,
      offX: 0, offY: 0,
      vx: 0, vy: 0,
      driftPhase: rand(0, Math.PI * 2),
      driftSpeed: rand(0.0003, 0.0008)
    };
  });

  window.addEventListener('resize', () => {
    // re-anchor home positions proportionally on resize
    bodies.forEach(b => {
      b.homeX = b.homeX / (b._lastW || W) * W;
      b.homeY = b.homeY / (b._lastH || H) * H;
      b._lastW = W; b._lastH = H;
    });
    stars.forEach(s => {
      s.homeX = s.homeX / (s._lastW || W) * W;
      s.homeY = s.homeY / (s._lastH || H) * H;
      s._lastW = W; s._lastH = H;
    });
  });

  // ---------- Shooting stars / meteorites ----------
  const shooters = [];

  function spawnShooter() {
    const fromLeft = Math.random() < 0.5;
    const y0 = rand(0, H * 0.6);
    const x0 = fromLeft ? rand(-50, W * 0.3) : rand(W * 0.7, W + 50);
    const angle = fromLeft ? rand(0.25, 0.55) : Math.PI - rand(0.25, 0.55);
    const speed = rand(6, 11);
    shooters.push({
      x: x0, y: y0,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: rand(40, 70),
      len: rand(60, 140)
    });
  }

  setInterval(() => {
    if (Math.random() < 0.7) spawnShooter();
  }, 2200);

  // initial couple
  setTimeout(spawnShooter, 800);

  // ---------- Physics: displacement without return ----------
  const REPEL_RADIUS = 140;
  const REPEL_STRENGTH = 5.5;
  const FRICTION = 0.94;
  const DRIFT_BACK = 0.0015; // extremely gentle pull toward a *new* wandering point, not home

  function updateStar(s) {
    const dx = s.x - mouse.x;
    const dy = s.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;

    if (mouse.active && dist < REPEL_RADIUS) {
      const force = (1 - dist / REPEL_RADIUS) * REPEL_STRENGTH;
      s.vx += (dx / dist) * force;
      s.vy += (dy / dist) * force;
      // also inherit a bit of mouse velocity for a "swept" feel
      s.vx += mouse.vx * 0.03;
      s.vy += mouse.vy * 0.03;
    }

    s.vx *= FRICTION;
    s.vy *= FRICTION;
    s.x += s.vx;
    s.y += s.vy;

    // soft wrap so displaced stars don't vanish forever
    if (s.x < -20) s.x = W + 20;
    if (s.x > W + 20) s.x = -20;
    if (s.y < -20) s.y = H + 20;
    if (s.y > H + 20) s.y = -20;

    s.twinklePhase += s.twinkleSpeed;
  }

  function updateBody(b, t) {
    // gentle perpetual drift so the scene feels alive even without mouse
    const driftX = Math.cos(t * b.driftSpeed + b.driftPhase) * 6;
    const driftY = Math.sin(t * b.driftSpeed * 1.3 + b.driftPhase) * 6;

    const cx = b.x, cy = b.y;
    const dx = cx - mouse.x;
    const dy = cy - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
    const radius = REPEL_RADIUS + b.r * 1.6;

    if (mouse.active && dist < radius) {
      const force = (1 - dist / radius) * (REPEL_STRENGTH * 1.4);
      b.vx += (dx / dist) * force;
      b.vy += (dy / dist) * force;
      b.vx += mouse.vx * 0.02;
      b.vy += mouse.vy * 0.02;
    }

    b.vx *= 0.92;
    b.vy *= 0.92;
    b.x += b.vx;
    b.y += b.vy;

    // keep bodies loosely within the viewport (soft bounds, not snap-back)
    const margin = b.r + 10;
    if (b.x < margin) { b.x = margin; b.vx *= -0.4; }
    if (b.x > W - margin) { b.x = W - margin; b.vx *= -0.4; }
    if (b.y < margin) { b.y = margin; b.vy *= -0.4; }
    if (b.y > H - margin) { b.y = H - margin; b.vy *= -0.4; }

    b._drawX = b.x + driftX;
    b._drawY = b.y + driftY;
  }

  function drawStar(s) {
    const tw = 0.55 + Math.sin(s.twinklePhase) * 0.45;
    const alpha = Math.max(0, Math.min(1, s.baseAlpha * tw));
    ctx.beginPath();
    if (s.hue) {
      ctx.fillStyle = `hsla(${s.hue}, 90%, 80%, ${alpha})`;
    } else {
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    }
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    if (s.r > 1.3) {
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(s.x - s.r * 3, s.y);
      ctx.lineTo(s.x + s.r * 3, s.y);
      ctx.moveTo(s.x, s.y - s.r * 3);
      ctx.lineTo(s.x, s.y + s.r * 3);
      ctx.stroke();
    }
  }

  function drawBody(b) {
    const x = b._drawX, y = b._drawY, r = b.r;
    const grad = ctx.createRadialGradient(
      x - r * 0.35, y - r * 0.35, r * 0.1,
      x, y, r
    );
    grad.addColorStop(0, b.colors[0]);
    grad.addColorStop(0.55, b.colors[1]);
    grad.addColorStop(1, b.colors[2]);

    if (b.type === 'sun') {
      const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3.2);
      glow.addColorStop(0, 'rgba(255, 200, 120, 0.35)');
      glow.addColorStop(1, 'rgba(255, 200, 120, 0)');
      ctx.beginPath();
      ctx.fillStyle = glow;
      ctx.arc(x, y, r * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    if (b.ring) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.35);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.9, r * 0.5, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 230, 190, 0.55)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.fillStyle = grad;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawShooter(sh) {
    const t = sh.life / sh.maxLife;
    const alpha = Math.sin(Math.PI * t);
    const tailX = sh.x - sh.vx * (sh.len / Math.hypot(sh.vx, sh.vy));
    const tailY = sh.y - sh.vy * (sh.len / Math.hypot(sh.vx, sh.vy));
    const grad = ctx.createLinearGradient(sh.x, sh.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sh.x, sh.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.arc(sh.x, sh.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  let t = 0;
  function frame() {
    t++;
    ctx.clearRect(0, 0, W, H);

    // deep space gradient backdrop
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.8);
    bg.addColorStop(0, '#0b0f2a');
    bg.addColorStop(1, '#05060f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    stars.forEach(s => { updateStar(s); drawStar(s); });
    bodies.forEach(b => { updateBody(b, t); drawBody(b); });

    for (let i = shooters.length - 1; i >= 0; i--) {
      const sh = shooters[i];
      sh.x += sh.vx;
      sh.y += sh.vy;
      sh.life++;
      drawShooter(sh);
      if (sh.life > sh.maxLife || sh.x < -100 || sh.x > W + 100 || sh.y > H + 100) {
        shooters.splice(i, 1);
      }
    }

    mouse.vx *= 0.8;
    mouse.vy *= 0.8;

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
